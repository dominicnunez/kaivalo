name: Dependency Sweep

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run dependency sweep
        id: check
        run: node scripts/check-dependency-sweep.ts --github-output

      - name: Write workflow summary
        run: printf '%s\n' "${{ steps.check.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing tracking issue
        id: find_issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const match =
              issues.find(
                (issue) => !issue.pull_request && issue.title === title
              ) ?? null;
            core.setOutput('issue_number', match ? String(match.number) : '');
        env:
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}

      - name: Create tracking issue
        if: steps.check.outputs.has_items_to_review == 'true' && steps.find_issue.outputs.issue_number == ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ISSUE_TITLE,
              body: process.env.ISSUE_BODY
            });
        env:
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}

      - name: Update tracking issue
        if: steps.check.outputs.has_items_to_review == 'true' && steps.find_issue.outputs.issue_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              title: process.env.ISSUE_TITLE,
              body: process.env.ISSUE_BODY
            });
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}

      - name: Close resolved tracking issue
        if: steps.check.outputs.has_items_to_review != 'true' && steps.find_issue.outputs.issue_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: process.env.RESOLUTION_COMMENT
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          RESOLUTION_COMMENT: The manual dependency sweep found no direct dependency updates or unallowlisted advisories requiring review, so this tracking issue no longer reflects outstanding dependency maintenance work.
