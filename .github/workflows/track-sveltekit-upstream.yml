name: Track SvelteKit Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24.14.0

      - name: Check upstream SvelteKit release
        id: check
        run: node scripts/check-sveltekit-upstream.ts --github-output

      - name: Write workflow summary
        run: printf '%s\n' "${{ steps.check.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing tracking issue
        if: steps.check.outputs.has_newer_upstream == 'true'
        id: find_issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const match = issues.find((issue) => issue.title === title) ?? null;
            core.setOutput('issue_number', match ? String(match.number) : '');
        env:
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}

      - name: Create tracking issue
        if: steps.check.outputs.has_newer_upstream == 'true' && steps.find_issue.outputs.issue_number == ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ISSUE_TITLE,
              body: process.env.ISSUE_BODY
            });
        env:
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}

      - name: Update tracking issue
        if: steps.check.outputs.has_newer_upstream == 'true' && steps.find_issue.outputs.issue_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              title: process.env.ISSUE_TITLE,
              body: process.env.ISSUE_BODY
            });
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.check.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}
