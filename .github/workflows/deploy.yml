name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kaivalo-hub
  SERVICE_NAME: kaivalo

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full deploy test suite
        run: npm run test:deploy

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Lowercase image name
        id: image
        env:
          RAW_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          image_name="$(printf '%s' "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Publish image reference
        id: image_ref
        run: |
          echo "image_ref=${{ steps.image.outputs.image_name }}@${{ steps.build_push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Validate image reference
        env:
          IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: |
          if [ -z "$IMAGE_REF" ]; then
            echo "image_ref output is empty" >&2
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_SSH_KEY"
          printf 'DEPLOY_HOST=%s\nDEPLOY_PORT=%s\nDEPLOY_USER=%s\n' "$DEPLOY_HOST" "${DEPLOY_PORT:-22}" "$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Deploy image
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy-app $SERVICE_NAME ${{ needs.build.outputs.image_ref }}"

      - name: Verify deployment health
        env:
          DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
        run: |
          deploy_origin="${DEPLOY_ORIGIN%/}"
          if [ -z "$deploy_origin" ]; then
            echo "DEPLOY_ORIGIN must be set for production health verification" >&2
            exit 1
          fi

          expected_origin="$(node -e 'const candidate = process.argv[1]; const parsed = new URL(candidate); if (parsed.username || parsed.password || parsed.pathname !== "/" || parsed.search || parsed.hash) { throw new Error("DEPLOY_ORIGIN must be a bare origin"); } process.stdout.write(parsed.origin);' "$deploy_origin")"

          request_url() {
            local pathname="$1"
            printf '%s/%s' "$expected_origin" "${pathname#/}"
          }

          run_probe() {
            local url="$1"
            local accept_header="${2:-}"
            local body_file
            local header_file
            local probe_output

            body_file="$(mktemp)"
            header_file="$(mktemp)"

            if [ -n "$accept_header" ]; then
              probe_output="$(
                curl \
                  --silent \
                  --show-error \
                  --retry 6 \
                  --retry-delay 10 \
                  --retry-connrefused \
                  --connect-timeout 10 \
                  --max-time 20 \
                  --header "accept: $accept_header" \
                  --dump-header "$header_file" \
                  --output "$body_file" \
                  --write-out '%{http_code}\n%{url_effective}\n' \
                  "$url"
              )"
            else
              probe_output="$(
                curl \
                  --silent \
                  --show-error \
                  --retry 6 \
                  --retry-delay 10 \
                  --retry-connrefused \
                  --connect-timeout 10 \
                  --max-time 20 \
                  --dump-header "$header_file" \
                  --output "$body_file" \
                  --write-out '%{http_code}\n%{url_effective}\n' \
                  "$url"
              )"
            fi

            mapfile -t probe_meta <<< "$probe_output"
            PROBE_STATUS="${probe_meta[0]}"
            PROBE_EFFECTIVE_URL="${probe_meta[1]}"
            PROBE_BODY="$(cat "$body_file")"
            PROBE_LOCATION="$(
              awk 'BEGIN { IGNORECASE = 1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, "", $0); sub(/\r$/, "", $0); print; exit }' "$header_file"
            )"

            rm -f "$body_file" "$header_file"
          }

          assert_no_redirect_probe() {
            local url="$1"
            local expected_status="$2"

            run_probe "$url"

            if [ "$PROBE_STATUS" != "$expected_status" ]; then
              echo "Expected $url to return $expected_status, received $PROBE_STATUS" >&2
              exit 1
            fi

            if [ "$PROBE_EFFECTIVE_URL" != "$url" ]; then
              echo "Expected $url to stay on the canonical origin, received $PROBE_EFFECTIVE_URL" >&2
              exit 1
            fi

            if [ -n "$PROBE_LOCATION" ]; then
              echo "Expected $url not to redirect, received location $PROBE_LOCATION" >&2
              exit 1
            fi
          }

          root_url="$(request_url /)"
          assert_no_redirect_probe "$root_url" "200"

          health_url="$(request_url /healthz)"
          assert_no_redirect_probe "$health_url" "200"
          if [ "$PROBE_BODY" != "ok" ]; then
            echo "Expected /healthz to return plain-text ok" >&2
            exit 1
          fi

          callback_url="$(request_url /auth/callback)"
          run_probe "$callback_url" "text/html"

          if [ "$PROBE_STATUS" != "303" ]; then
            echo "Expected /auth/callback to return a same-origin browser redirect, received $PROBE_STATUS" >&2
            exit 1
          fi

          if [ "$PROBE_EFFECTIVE_URL" != "$callback_url" ]; then
            echo "Expected /auth/callback probe to stay on the canonical callback URL, received $PROBE_EFFECTIVE_URL" >&2
            exit 1
          fi

          if [ -z "$PROBE_LOCATION" ]; then
            echo "Expected /auth/callback to include a redirect location" >&2
            exit 1
          fi

          node -e 'const expectedOrigin = process.argv[1]; const location = process.argv[2]; const parsed = new URL(location, expectedOrigin); if (parsed.origin !== expectedOrigin) { throw new Error(`Expected callback redirect to stay on ${expectedOrigin}, received ${parsed.origin}`); } if (parsed.pathname !== "/") { throw new Error(`Expected callback redirect to land on /, received ${parsed.pathname}`); } if (!parsed.search) { throw new Error("Expected callback redirect to include query parameters"); }' "$expected_origin" "$PROBE_LOCATION"
