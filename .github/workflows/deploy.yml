name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kaivalo-hub
  SERVICE_NAME: kaivalo

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full deploy test suite
        run: npm run test:deploy

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Lowercase image name
        id: image
        env:
          RAW_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          image_name="$(printf '%s' "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Build and push image
        id: build_push
        env:
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          AUTH_ERROR_SIGNING_SECRET: ${{ secrets.AUTH_ERROR_SIGNING_SECRET }}
          ORIGIN: ${{ secrets.ORIGIN }}
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_name }}:${{ github.sha }}
          secrets: |
            "workos_client_id=${{ secrets.WORKOS_CLIENT_ID }}"
            "workos_api_key=${{ secrets.WORKOS_API_KEY }}"
            "workos_redirect_uri=${{ secrets.WORKOS_REDIRECT_URI }}"
            "workos_cookie_password=${{ secrets.WORKOS_COOKIE_PASSWORD }}"
            "auth_error_signing_secret=${{ secrets.AUTH_ERROR_SIGNING_SECRET }}"
            "origin=${{ secrets.ORIGIN }}"

      - name: Publish image reference
        id: image_ref
        run: |
          echo "image_ref=${{ steps.image.outputs.image_name }}@${{ steps.build_push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Validate image reference
        env:
          IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: |
          if [ -z "$IMAGE_REF" ]; then
            echo "image_ref output is empty" >&2
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_SSH_KEY"
          printf 'DEPLOY_HOST=%s\nDEPLOY_PORT=%s\nDEPLOY_USER=%s\n' "$DEPLOY_HOST" "${DEPLOY_PORT:-22}" "$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Deploy image
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy-app $SERVICE_NAME ${{ needs.build.outputs.image_ref }}"
